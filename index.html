<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arcade Prototypes</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1020;color:#eef;font-family:system-ui,sans-serif}
h1{text-align:center;letter-spacing:.05em}
.grid{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
a{display:block;width:220px;padding:28px 20px;border-radius:14px;text-decoration:none;color:#fff;font-weight:700;font-size:1.3rem;text-align:center;transition:transform .15s}
a:hover{transform:translateY(-4px) scale(1.03)}
a span{display:block;font-weight:400;font-size:.9rem;opacity:.85;margin-top:8px}
.arena{background:linear-gradient(135deg,#e5484d,#8e1f3b)}
.downhill{background:linear-gradient(135deg,#3e9bff,#1b3f8f)}
.golf{background:linear-gradient(135deg,#30a46c,#145a3a)}
</style></head><body><main>
<h1>ARCADE PROTOTYPES</h1>
<div class="grid">
<a class="arena" href="arena/">Arena Royale<span>Last one standing</span></a>
<a class="downhill" href="downhill/">Downhill Rush<span>Ski or board to the finish</span></a>
<a class="golf" href="golf/">Mini-Golf Battle<span>Same hole, same time</span></a>
</div></main></body></html>
