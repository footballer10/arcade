<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160">
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe2b8"/><stop offset="1" stop-color="#ffc98a"/></linearGradient>
    <linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9a066"/><stop offset="1" stop-color="#b47a44"/></linearGradient>
    <radialGradient id="l" cx="0.5" cy="0.2" r="0.8"><stop offset="0" stop-color="#fff6c8" stop-opacity=".9"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="320" height="160" fill="url(#w)"/>
  <rect y="112" width="320" height="48" fill="url(#f)"/>
  <g stroke="#17112e" stroke-width="1" opacity=".25"><line x1="40" y1="112" x2="20" y2="160"/><line x1="110" y1="112" x2="100" y2="160"/><line x1="180" y1="112" x2="185" y2="160"/><line x1="250" y1="112" x2="270" y2="160"/></g>
  <ellipse cx="160" cy="20" rx="140" ry="60" fill="url(#l)"/>
  <!-- counter -->
  <rect x="190" y="70" width="130" height="50" rx="4" fill="#8fd6c0" stroke="#17112e" stroke-width="4"/>
  <rect x="186" y="62" width="138" height="10" rx="3" fill="#f2ede4" stroke="#17112e" stroke-width="4"/>
  <!-- kettle (decoy) -->
  <path d="M286 62 q0 -26 16 -26 q16 0 16 26z" fill="#5ec8ff" stroke="#17112e" stroke-width="4"/>
  <!-- toaster with eyes (hider!) running -->
  <g transform="translate(206 30) rotate(-8)">
