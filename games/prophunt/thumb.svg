    <rect x="12" y="-6" width="10" height="14" rx="2" fill="#f2b25c" stroke="#17112e" stroke-width="3"/>
    <rect x="36" y="-6" width="10" height="14" rx="2" fill="#f2b25c" stroke="#17112e" stroke-width="3"/>
    <circle cx="22" cy="20" r="6" fill="#fff" stroke="#17112e" stroke-width="2.5"/><circle cx="24" cy="21" r="2.6" fill="#17112e"/>
    <circle cx="40" cy="20" r="6" fill="#fff" stroke="#17112e" stroke-width="2.5"/><circle cx="42" cy="21" r="2.6" fill="#17112e"/>
  </g>
  <text x="270" y="30" font-family="Lilita One, sans-serif" font-size="22" fill="#fff" stroke="#17112e" stroke-width="5" paint-order="stroke">♪</text>
  <!-- seeker bean with hammer -->
  <g transform="translate(70 40)">
    <rect x="-26" y="10" width="52" height="66" rx="26" fill="#3ea6ff" stroke="#17112e" stroke-width="4"/>
    <circle cx="-9" cy="30" r="7" fill="#fff" stroke="#17112e" stroke-width="2.5"/><circle cx="-6" cy="30" r="3" fill="#17112e"/>
    <circle cx="11" cy="30" r="7" fill="#fff" stroke="#17112e" stroke-width="2.5"/><circle cx="14" cy="30" r="3" fill="#17112e"/>
    <path d="M-22 12 q22 -22 44 0 z" fill="#ffcc00" stroke="#17112e" stroke-width="4"/>
    <g transform="translate(30 46) rotate(-35)">
      <rect x="-4" y="-46" width="8" height="50" rx="3" fill="#3ea6ff" stroke="#17112e" stroke-width="3"/>
      <rect x="-24" y="-66" width="48" height="26" rx="10" fill="#ff4d6a" stroke="#17112e" stroke-width="4"/>
      <rect x="-4" y="-66" width="8" height="26" fill="#ffd23f" stroke="#17112e" stroke-width="2"/>
    </g>
  </g>
  <!-- potted plant -->
  <rect x="136" y="92" width="30" height="26" rx="4" fill="#d9733a" stroke="#17112e" stroke-width="4"/>
  <circle cx="151" cy="80" r="17" fill="#46b85a" stroke="#17112e" stroke-width="4"/>
  <text x="160" y="152" text-anchor="middle" font-family="Lilita One, sans-serif" font-size="34" fill="#ffd23f" stroke="#17112e" stroke-width="7" paint-order="stroke" transform="rotate(-3 160 140)">PROP HUNT</text>
